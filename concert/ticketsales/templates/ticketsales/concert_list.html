{% load static %}
<!DOCTYPE html>
<html dir="rtl">

<head>
    <title>سامانه فروش بلیط کنسرت</title>
    <link rel="stylesheet" type="text/css" href="{% static 'ticketsales/css/style.css' %}">
</head>

<body>
    <h1>لیست کنسرت ها</h1>
    <ul>
        {% if concert_list %}
        <p>تعداد کنسرت های موجود: {{concert_count}}</p>
        {% for concert in concert_list %}
        <li>
            {{ concert }}
        </li>
        {% endfor %}
        {% endif %}
    </ul>
</body>

</html>
